[package]
name = "omnihear_dsp_core"
version = "0.1.0"
edition = "2021"
authors = ["OmniHear Open Source"]

[dependencies]
cpal = "0.15"            # Low-latency audio I/O
btleplug = "0.10"        # Cross-platform BLE
tokio = { version = "1.28", features = ["full"] }
uuid = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
